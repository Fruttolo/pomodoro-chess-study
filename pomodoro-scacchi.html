<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Studio ⇄ Pausa — timer a scacchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --bg2:#11141b;
    --surface:#171b23;
    --surface-2:#1e2430;
    --line:#2a3140;
    --text:#eef1f6;
    --muted:#8b93a3;
    --faint:#5c6373;
    --study:#5b9dff;
    --study-glow:rgba(91,157,255,.30);
    --break:#33d39a;
    --break-glow:rgba(51,211,154,.28);
    --orange:#ff7a1a;
    --orange-2:#ff9342;
    --orange-press:#e5680a;
    --red:#ff4d52;
    --red-2:#ff7378;
    --radius:18px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2030 0%, transparent 60%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }

  .wrap{
    width:100%;
    max-width:660px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---- header ---- */
  header{text-align:center;}
  .eyebrow{
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--faint);
    margin:0 0 6px;
  }
  h1{
    margin:0;
    font-size:clamp(1.35rem,5vw,1.7rem);
    font-weight:700;
    letter-spacing:-.01em;
  }
  h1 .swap{color:var(--muted);font-weight:500;padding:0 .12em;}

  /* ---- timer cards ---- */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(225px,1fr));
    gap:14px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px 18px;
    overflow:hidden;
    transition:border-color .25s, background .25s, box-shadow .35s, opacity .25s, transform .25s;
  }
  .card .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .card .name{
    font-size:.74rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .pill{
    font-size:.66rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:999px;
    color:var(--faint);
    border:1px solid var(--line);
    background:var(--bg2);
    white-space:nowrap;
  }
  .time{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(2.9rem,13vw,4rem);
    line-height:1;
    letter-spacing:-.02em;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    transition:color .25s;
  }
  .bar{
    margin-top:16px;
    height:5px;
    border-radius:999px;
    background:var(--bg2);
    overflow:hidden;
  }
  .bar > i{
    display:block;
    height:100%;
    width:100%;
    border-radius:999px;
    background:var(--faint);
    transition:width .25s linear, background .25s;
  }

  /* study / break identity */
  .card[data-t="study"] .dot-c{background:var(--study);}
  .card[data-t="break"] .dot-c{background:var(--break);}

  /* active state */
  .card.active{background:var(--surface-2);}
  .card[data-t="study"].active{
    border-color:var(--study);
    box-shadow:0 0 0 1px var(--study), 0 14px 40px -12px var(--study-glow);
  }
  .card[data-t="break"].active{
    border-color:var(--break);
    box-shadow:0 0 0 1px var(--break), 0 14px 40px -12px var(--break-glow);
  }
  .card[data-t="study"].active .time{color:#bcd6ff;}
  .card[data-t="break"].active .time{color:#a9f0d6;}
  .card[data-t="study"].active .bar > i{background:var(--study);}
  .card[data-t="break"].active .bar > i{background:var(--break);}
  .card[data-t="study"].active .pill{color:#bcd6ff;border-color:var(--study);background:transparent;}
  .card[data-t="break"].active .pill{color:#a9f0d6;border-color:var(--break);background:transparent;}
  .card.active{animation:breathe 2.6s ease-in-out infinite;}
  @keyframes breathe{50%{transform:translateY(-2px);}}

  /* waiting (running, not active) */
  .card.waiting{opacity:.62;}
  .card.waiting .time{color:var(--muted);}

  /* finished / used up */
  .card.done{opacity:.5;filter:saturate(.4);}
  .card.done .time{color:var(--faint);}
  .card.done .pill{color:#ffb0b3;border-color:#5a2b2d;background:transparent;}
  .card.done .bar > i{background:var(--faint);}

  /* idle */
  .card.idle{opacity:.9;}

  /* ---- actions ---- */
  .actions{display:flex;flex-direction:column;gap:10px;}
  .btn{
    font-family:var(--sans);
    font-size:1.02rem;
    font-weight:600;
    border:0;
    border-radius:14px;
    min-height:56px;
    padding:0 20px;
    cursor:pointer;
    color:#fff;
    letter-spacing:.01em;
    transition:transform .06s, filter .15s, background .15s, opacity .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.985);}
  .btn:focus-visible{outline:3px solid #ffffff8c;outline-offset:2px;}

  .btn.primary{
    background:linear-gradient(180deg,var(--orange-2),var(--orange));
    box-shadow:0 10px 26px -12px rgba(255,122,26,.7);
  }
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.primary:active{background:var(--orange-press);}
  .btn.primary:disabled{
    cursor:not-allowed;
    background:var(--surface-2);
    color:var(--faint);
    box-shadow:none;
    border:1px solid var(--line);
  }

  .btn.stop{
    background:linear-gradient(180deg,var(--red-2),var(--red));
    box-shadow:0 10px 30px -10px rgba(255,77,82,.6);
    display:flex;align-items:center;justify-content:center;gap:9px;
    animation:alarm 1s ease-in-out infinite;
  }
  .btn.stop svg{width:20px;height:20px;flex:0 0 auto;}
  @keyframes alarm{50%{filter:brightness(1.18);transform:scale(1.012);}}

  .btn.ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    min-height:48px;
    font-weight:500;
  }
  .btn.ghost:hover{color:var(--text);border-color:var(--faint);}

  .hidden{display:none !important;}

  /* ---- settings ---- */
  .settings{
    display:flex;
    flex-wrap:wrap;
    gap:14px 26px;
    justify-content:center;
    align-items:center;
    padding:16px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:linear-gradient(180deg,var(--bg2),transparent);
  }
  .set-group{display:flex;align-items:center;gap:10px;}
  .set-group .lbl{
    font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    min-width:54px;
  }
  .timefield{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:5px 8px;
  }
  .timefield .colon{color:var(--faint);font-family:var(--mono);padding:0 1px;}
  .stepper{display:flex;align-items:center;gap:5px;}
  .step-val{
    font-family:var(--mono);font-size:1.05rem;font-weight:500;
    color:var(--text);width:2.6ch;text-align:center;
    background:transparent;border:0;padding:0;
    -moz-appearance:textfield;appearance:textfield;
  }
  .step-val::-webkit-outer-spin-button,
  .step-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .step-val:focus{outline:none;}
  .step-val:focus-visible{outline:2px solid #ffffff66;border-radius:4px;}
  .step-btn{
    font-family:var(--mono);font-size:1.1rem;font-weight:700;
    width:26px;height:26px;padding:0;
    border:1px solid var(--line);border-radius:6px;
    background:var(--bg2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    line-height:1;transition:background .12s,color .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .step-btn:hover:not(:disabled){background:var(--surface-2);color:var(--text);}
  .step-btn:active:not(:disabled){background:var(--line);}
  .step-btn:disabled{opacity:.35;cursor:not-allowed;}
  .settings.locked{opacity:.5;}
  .settings.locked .step-btn{pointer-events:none;}

  /* ---- sound toggle ---- */
  .toggle-wrap{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .toggle-wrap .lbl{
    font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }
  .toggle-switch{
    position:relative;width:38px;height:22px;flex:0 0 auto;
  }
  .toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
  .toggle-track{
    position:absolute;inset:0;
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
    transition:background .2s,border-color .2s;
  }
  .toggle-thumb{
    position:absolute;top:3px;left:3px;
    width:14px;height:14px;border-radius:50%;
    background:var(--faint);
    transition:transform .18s,background .2s;
  }
  .toggle-switch input:checked ~ .toggle-track{
    background:rgba(91,157,255,.18);border-color:var(--study);
  }
  .toggle-switch input:checked ~ .toggle-thumb{
    transform:translateX(16px);background:var(--study);
  }
  .toggle-switch input:focus-visible ~ .toggle-track{
    outline:2px solid #ffffff66;outline-offset:2px;
  }

  /* ---- footnote ---- */
  .note{
    text-align:center;color:var(--faint);font-size:.8rem;line-height:1.55;
    margin:0;
  }
  .note b{color:var(--muted);font-weight:600;}

  /* ringing vignette */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 120px 12px rgba(255,77,82,0);
    transition:box-shadow .3s;z-index:5;
  }
  body.ringing::after{
    box-shadow:inset 0 0 120px 14px rgba(255,77,82,.22);
    animation:vig 1s ease-in-out infinite;
  }
  @keyframes vig{50%{box-shadow:inset 0 0 150px 18px rgba(255,77,82,.30);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
    .btn:active{transform:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Timer a scacchi</p>
      <h1>Studio<span class="swap">⇄</span>Pausa</h1>
    </header>

    <section class="cards">
      <div class="card idle" data-t="study" id="cardStudy">
        <div class="top">
          <span class="name">Studio</span>
          <span class="pill" id="pillStudy">pronto</span>
        </div>
        <div class="time" id="timeStudy">25:00</div>
        <div class="bar"><i id="barStudy"></i></div>
      </div>

      <div class="card idle" data-t="break" id="cardBreak">
        <div class="top">
          <span class="name">Pausa</span>
          <span class="pill" id="pillBreak">pronto</span>
        </div>
        <div class="time" id="timeBreak">05:00</div>
        <div class="bar"><i id="barBreak"></i></div>
      </div>
    </section>

    <div class="actions">
      <button class="btn stop hidden" id="stopBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3l18 18"/><path d="M18.5 14.5V11a6.5 6.5 0 0 0-9.2-5.9"/><path d="M6 8.2V11c0 3-1.5 4.2-2 5h11.5"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/>
        </svg>
        Ferma suono
      </button>
      <button class="btn primary" id="mainBtn" type="button">Avvia</button>
      <button class="btn ghost hidden" id="resetBtn" type="button">Reset</button>
    </div>

    <div class="settings" id="settings">
      <div class="set-group">
        <span class="lbl">Studio</span>
        <div class="timefield">
          <div class="stepper">
            <button class="step-btn" id="studyMinDec" type="button" aria-label="Diminuisci minuti studio">−</button>
            <input class="step-val" id="studyMinVal" type="number" inputmode="numeric" min="0" max="999" value="25" aria-label="Minuti studio">
            <button class="step-btn" id="studyMinInc" type="button" aria-label="Aumenta minuti studio">+</button>
          </div>
          <span class="colon">:</span>
          <div class="stepper">
            <button class="step-btn" id="studySecDec" type="button" aria-label="Diminuisci secondi studio">−</button>
            <input class="step-val" id="studySecVal" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="Secondi studio">
            <button class="step-btn" id="studySecInc" type="button" aria-label="Aumenta secondi studio">+</button>
          </div>
        </div>
      </div>
      <label class="set-group toggle-wrap" for="studySoundChk">
        <div class="toggle-switch">
          <input type="checkbox" id="studySoundChk" checked>
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </div>
        <span class="lbl">Suono studio</span>
      </label>
      <div class="set-group">
        <span class="lbl">Pausa</span>
        <div class="timefield">
          <div class="stepper">
            <button class="step-btn" id="breakMinDec" type="button" aria-label="Diminuisci minuti pausa">−</button>
            <input class="step-val" id="breakMinVal" type="number" inputmode="numeric" min="0" max="999" value="5" aria-label="Minuti pausa">
            <button class="step-btn" id="breakMinInc" type="button" aria-label="Aumenta minuti pausa">+</button>
          </div>
          <span class="colon">:</span>
          <div class="stepper">
            <button class="step-btn" id="breakSecDec" type="button" aria-label="Diminuisci secondi pausa">−</button>
            <input class="step-val" id="breakSecVal" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="Secondi pausa">
            <button class="step-btn" id="breakSecInc" type="button" aria-label="Aumenta secondi pausa">+</button>
          </div>
        </div>
      </div>
    </div>

  </div>

<script>
(function(){
  "use strict";

  // ---------- elements ----------
  const $ = id => document.getElementById(id);
  const cardStudy=$("cardStudy"), cardBreak=$("cardBreak");
  const timeStudy=$("timeStudy"), timeBreak=$("timeBreak");
  const pillStudy=$("pillStudy"), pillBreak=$("pillBreak");
  const barStudy=$("barStudy"), barBreak=$("barBreak");
  const mainBtn=$("mainBtn"), stopBtn=$("stopBtn"), resetBtn=$("resetBtn");
  const studySoundChk=$("studySoundChk");
  const settings=$("settings");
  const studyMinVal=$("studyMinVal"), studySecVal=$("studySecVal");
  const breakMinVal=$("breakMinVal"), breakSecVal=$("breakSecVal");
  const studyMinDec=$("studyMinDec"), studyMinInc=$("studyMinInc");
  const studySecDec=$("studySecDec"), studySecInc=$("studySecInc");
  const breakMinDec=$("breakMinDec"), breakMinInc=$("breakMinInc");
  const breakSecDec=$("breakSecDec"), breakSecInc=$("breakSecInc");
  const stepBtns=[studyMinDec,studyMinInc,studySecDec,studySecInc,
                  breakMinDec,breakMinInc,breakSecDec,breakSecInc];

  // ---------- stepper state ----------
  let sMin=25, sSec=0, bMin=5, bSec=0;
  let studySoundEnabled=true;

  // ---------- state ----------
  let phase="idle";          // "idle" | "running"
  let active="study";        // "study" | "break"
  let studyTotal=1500, breakTotal=300;
  let studyRem=1500, breakRem=300;
  let studyDone=false, breakDone=false;
  let ringing=false;
  let lastTs=0, loopId=null;

  // ---------- helpers ----------
  function fmt(sec){
    sec=Math.max(0,Math.ceil(sec));
    const m=Math.floor(sec/60), s=sec%60;
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  }
  function fmtN(n,pad){ return String(n).padStart(pad,"0"); }
  function clamp(v,min,max){ v=parseInt(v,10); return isNaN(v)?min:Math.max(min,Math.min(max,v)); }
  function readInputs(){
    studyTotal=Math.max(1, sMin*60+sSec);
    breakTotal=Math.max(1, bMin*60+bSec);
  }
  function stepVal(cur,delta,min,max){ return Math.max(min,Math.min(max,cur+delta)); }
  function applyStep(){
    readInputs();
    if(phase==="idle"){
      studyRem=studyTotal; breakRem=breakTotal;
    }
    renderSteppers();
    render();
  }
  function renderSteppers(){
    studyMinVal.value=sMin;
    studySecVal.value=sSec;
    breakMinVal.value=bMin;
    breakSecVal.value=bSec;
  }

  // ---------- audio (melodic chime) ----------
  const NOTES=[523.25,659.25,783.99,1046.5]; // C5 E5 G5 C6 – major arpeggio
  const NOTE_SPACING=0.34;   // seconds between note onsets
  const PHRASE_INTERVAL=3200; // ms between phrase starts
  let actx=null, melodyTimer=null;

  function ensureCtx(){
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
  }
  function playNote(freq,startTime){
    const osc=actx.createOscillator(), gain=actx.createGain();
    osc.type="sine";
    osc.frequency.value=freq;
    const t=startTime;
    gain.gain.setValueAtTime(0.001,t);
    gain.gain.exponentialRampToValueAtTime(0.20,t+0.012);
    gain.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t); osc.stop(t+1.15);
  }
  function playPhrase(){
    if(!actx) return;
    const now=actx.currentTime+0.02;
    NOTES.forEach((freq,i)=>playNote(freq,now+i*NOTE_SPACING));
  }
  function startSound(){
    ensureCtx();
    if(ringing) return;
    ringing=true;
    playPhrase();
    melodyTimer=setInterval(playPhrase,PHRASE_INTERVAL);
    render();
  }
  function stopSound(){
    ringing=false;
    if(melodyTimer){ clearInterval(melodyTimer); melodyTimer=null; }
    render();
  }

  // ---------- core loop ----------
  function ensureLoop(){ if(loopId==null) loopId=setInterval(tick,200); }
  function tick(){
    if(phase!=="running") return;
    const now=performance.now();
    const dt=(now-lastTs)/1000;
    lastTs=now;
    if(active==="study"){
      studyRem=Math.max(0,studyRem-dt);
      if(studyRem<=0 && !studyDone) return finish("study");
    }else{
      breakRem=Math.max(0,breakRem-dt);
      if(breakRem<=0 && !breakDone) return finish("break");
    }
    render();
  }

  function finish(which){
    // RULE: study finishes but pause still has time ->
    // do NOT switch to pause. Reset study and bank one pause block onto pause remaining.
    if(which==="study" && breakRem>0 && !breakDone){
      studyRem=studyTotal;
      studyDone=false;
      breakRem=breakRem+breakTotal;
      active="study";
      lastTs=performance.now();
      if(studySoundEnabled) startSound();
      render();
      return;
    }

    if(which==="study") studyDone=true; else breakDone=true;
    if(which==="break") startSound();
    if(which==="study" && studySoundEnabled) startSound();
    if(studyDone && breakDone){
      // both used up -> reset whole session, study runs again
      studyRem=studyTotal; breakRem=breakTotal;
      studyDone=false; breakDone=false;
      active="study";
    }else{
      // hand over to the other timer automatically
      active = (which==="study") ? "break" : "study";
    }
    lastTs=performance.now();
    render();
  }

  // ---------- actions ----------
  function startSession(){
    readInputs();
    studyRem=studyTotal; breakRem=breakTotal;
    studyDone=false; breakDone=false;
    active="study"; phase="running";
    lastTs=performance.now();
    ensureLoop();
    render();
  }
  function switchActive(){
    if(phase!=="running") return;
    if(active==="study" && breakDone) return;   // can't go to a used-up timer
    if(active==="break" && studyDone) return;
    active = (active==="study") ? "break" : "study";
    lastTs=performance.now();
    render();
  }
  function resetAll(){
    phase="idle";
    stopSound();
    readInputs();
    studyRem=studyTotal; breakRem=breakTotal;
    studyDone=false; breakDone=false;
    active="study";
    render();
  }

  // ---------- render ----------
  function cardClass(card,t){
    const isActive = phase==="running" && active===t;
    const isDone   = (t==="study") ? studyDone : breakDone;
    card.classList.toggle("active", isActive);
    card.classList.toggle("done",  isDone && !isActive);
    card.classList.toggle("waiting", phase==="running" && !isActive && !isDone);
    card.classList.toggle("idle", phase==="idle");
  }
  function pillText(t){
    const isActive = phase==="running" && active===t;
    const isDone   = (t==="study") ? studyDone : breakDone;
    if(phase==="idle") return "pronto";
    if(isDone) return "esaurito";
    if(isActive) return "in corso";
    return "in attesa";
  }
  function render(){
    timeStudy.textContent=fmt(studyRem);
    timeBreak.textContent=fmt(breakRem);

    cardClass(cardStudy,"study"); cardClass(cardBreak,"break");
    pillStudy.textContent=pillText("study");
    pillBreak.textContent=pillText("break");

    barStudy.style.width=(studyTotal>0? Math.max(0,Math.min(1,studyRem/studyTotal)):0)*100+"%";
    barBreak.style.width=(breakTotal>0? Math.max(0,Math.min(1,breakRem/breakTotal)):0)*100+"%";

    if(phase==="idle"){
      mainBtn.textContent="Avvia"; mainBtn.disabled=false;
    }else if(active==="study"){
      mainBtn.textContent="Passa a pausa"; mainBtn.disabled=breakDone;
    }else{
      mainBtn.textContent="Riprendi studio"; mainBtn.disabled=studyDone;
    }

    stopBtn.classList.toggle("hidden", !ringing);
    resetBtn.classList.toggle("hidden", phase!=="running");

    const locked = phase==="running";
    settings.classList.toggle("locked", locked);
    stepBtns.forEach(el=>el.disabled=locked);
    [studyMinVal,studySecVal,breakMinVal,breakSecVal].forEach(el=>el.disabled=locked);

    document.body.classList.toggle("ringing", ringing);
  }

  // ---------- wiring ----------
  mainBtn.addEventListener("click", ()=>{
    ensureCtx();                          // unlock audio on user gesture
    if(phase==="idle") startSession(); else switchActive();
  });
  stopBtn.addEventListener("click", ()=>{ ensureCtx(); stopSound(); });
  resetBtn.addEventListener("click", ()=>{ ensureCtx(); resetAll(); });

  studyMinDec.addEventListener("click",()=>{ sMin=stepVal(sMin,-1,0,999); applyStep(); });
  studyMinInc.addEventListener("click",()=>{ sMin=stepVal(sMin,+1,0,999); applyStep(); });
  studySecDec.addEventListener("click",()=>{ sSec=stepVal(sSec,-1,0,59); applyStep(); });
  studySecInc.addEventListener("click",()=>{ sSec=stepVal(sSec,+1,0,59); applyStep(); });
  breakMinDec.addEventListener("click",()=>{ bMin=stepVal(bMin,-1,0,999); applyStep(); });
  breakMinInc.addEventListener("click",()=>{ bMin=stepVal(bMin,+1,0,999); applyStep(); });
  breakSecDec.addEventListener("click",()=>{ bSec=stepVal(bSec,-1,0,59); applyStep(); });
  breakSecInc.addEventListener("click",()=>{ bSec=stepVal(bSec,+1,0,59); applyStep(); });

  studyMinVal.addEventListener("input",()=>{ sMin=clamp(studyMinVal.value,0,999); applyStep(); });
  studySecVal.addEventListener("input",()=>{ sSec=clamp(studySecVal.value,0,59);  applyStep(); });
  breakMinVal.addEventListener("input",()=>{ bMin=clamp(breakMinVal.value,0,999); applyStep(); });
  breakSecVal.addEventListener("input",()=>{ bSec=clamp(breakSecVal.value,0,59);  applyStep(); });

  [studyMinVal,studySecVal,breakMinVal,breakSecVal].forEach(el=>{
    el.addEventListener("blur",()=>{ renderSteppers(); });
  });

  studySoundChk.addEventListener("change", ()=>{ studySoundEnabled=studySoundChk.checked; });

  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && ringing) ensureCtx(); });


  readInputs();
  studyRem=studyTotal; breakRem=breakTotal;
  renderSteppers();
  render();
})();
</script>
</body>
</html>
